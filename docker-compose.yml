services:
  app:
    image: ${IMAGE_PREFIX:-ghcr.io/owner/gun-brawl}:${TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: [.env]
    volumes: ["data:/data"]
    expose: ["8080"]
    networks: [web]
    # Container logs are unrotated by default; a long-running room server would fill the disk.
    logging: &json-logs
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  gateway:
    image: ${IMAGE_PREFIX:-ghcr.io/owner/gun-brawl}-gateway:${TAG:-latest}
    build:
      context: .
      dockerfile: Dockerfile.gateway
    restart: unless-stopped
    env_file: [.env]
    expose: ["8090"]
    networks: [web]
    logging: *json-logs

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    env_file: [.env]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy:/data
      - ./logs:/var/log/caddy
    depends_on: [app, gateway]
    networks: [web]
    logging: *json-logs

volumes:
  data: {}
  caddy: {}

networks:
  web: {}
